name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate installer syntax
        run: bash -n install.sh

      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s tests -v

      - name: Validate themes
        run: python3 tools/generate_ide_themes.py --check

      - name: Verify committed themes are reproducible
        shell: bash
        run: |
          output_dir="$(mktemp -d)"
          trap 'rm -rf "$output_dir"' EXIT
          python3 tools/generate_ide_themes.py --output "$output_dir" --no-backup
          diff -ru themes "$output_dir"
